<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>井口工務店 日本語学習ツール</title>
<style>
:root{
 --bg:#eef2f4; --card:#fff; --ink:#1c2733; --muted:#697883; --line:#e2e8ec;
 --primary:#2f6f83; --primary-d:#215566; --gold:#e0a52b; --ok:#3f9d5a; --ng:#d1584a;
 --shadow:0 2px 8px rgba(20,40,55,.08);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{font-family:-apple-system,"Segoe UI",Roboto,"Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif;
 background:var(--bg);color:var(--ink);line-height:1.6;font-size:16px;padding-bottom:74px}
ruby rt{font-size:.55em;color:var(--muted);font-weight:400}
.wrap{max-width:760px;margin:0 auto;padding:0 14px}
a{color:inherit}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
.hidden{display:none!important}

header.app{background:linear-gradient(135deg,var(--primary),var(--primary-d));color:#fff;padding:16px 0 14px}
header.app .wrap{display:flex;align-items:center;gap:10px}
header.app h1{font-size:17px;margin:0;font-weight:700;line-height:1.3}
header.app .sub{font-size:11px;opacity:.85;margin-top:2px}
.logo{width:36px;height:36px;border-radius:9px;background:rgba(255,255,255,.18);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:18px;flex:none}

section.view{padding:16px 0 20px}
.h2{font-size:15px;font-weight:800;margin:18px 0 10px;color:var(--primary-d);display:flex;align-items:center;gap:8px}
.h2:before{content:"";width:5px;height:16px;background:var(--primary);border-radius:3px}

.card{background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow)}
.pad{padding:14px 16px}

/* progress */
.stat-row{display:flex;gap:10px}
.stat{flex:1;text-align:center;padding:12px 6px}
.stat .n{font-size:24px;font-weight:800;color:var(--primary)}
.stat .l{font-size:11px;color:var(--muted);margin-top:2px}
.bar{height:10px;background:#e6ecef;border-radius:6px;overflow:hidden}
.bar>i{display:block;height:100%;background:linear-gradient(90deg,var(--primary),#4a97ab);border-radius:6px;transition:width .5s}
.pct{font-size:12px;color:var(--muted);margin-top:6px;display:flex;justify-content:space-between}

/* today word */
.tw{border-left:5px solid var(--primary);padding:12px 14px;margin-bottom:10px}
.tw .jp{font-size:22px;font-weight:800}
.tw .rd{font-size:13px;color:var(--muted);margin-top:2px}
.tw .rd b{color:var(--primary-d);font-weight:700}
.tw .mn{font-size:14px;margin-top:6px}
.tw .en{font-size:13px;color:var(--muted)}
.tw .ex{font-size:13px;margin-top:6px;background:#f4f8f9;border-radius:8px;padding:8px 10px}
.tw .ex .exen{color:var(--muted);font-style:italic}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;background:var(--primary);color:#fff;
 border-radius:11px;padding:12px 16px;font-weight:700;font-size:15px;width:100%;box-shadow:var(--shadow)}
.btn.sec{background:#fff;color:var(--primary-d);border:1.5px solid var(--primary)}
.btn.sm{width:auto;padding:8px 14px;font-size:13px}
.btn.gray{background:#eef2f4;color:var(--ink);box-shadow:none;border:1px solid var(--line)}
.btn-row{display:flex;gap:10px;margin-top:12px}

/* chips / filters */
.chips{display:flex;flex-wrap:wrap;gap:7px;margin:10px 0}
.chip{border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:6px 13px;font-size:13px;font-weight:600;color:var(--muted)}
.chip.on{background:var(--primary);border-color:var(--primary);color:#fff}
.selrow{display:flex;gap:8px;margin:8px 0}
select,input[type=text]{font-family:inherit;font-size:14px;border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;background:#fff;color:var(--ink);width:100%}
.search{position:relative}
.search input{padding-left:38px}
.search:before{content:"🔎";position:absolute;left:12px;top:50%;transform:translateY(-50%);font-size:15px;opacity:.6}

/* word list */
.wlist{display:flex;flex-direction:column;gap:9px}
.witem{display:flex;align-items:center;gap:10px;padding:11px 13px}
.witem .main{flex:1;min-width:0}
.witem .jp{font-size:18px;font-weight:800;line-height:1.25}
.witem .rd{font-size:12px;color:var(--muted);margin-top:1px}
.witem .rd b{color:var(--primary-d)}
.witem .en{font-size:12.5px;color:var(--muted);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.badges{display:flex;gap:5px;margin-top:5px;flex-wrap:wrap}
.badge{font-size:10.5px;font-weight:700;border-radius:6px;padding:2px 7px;color:#fff}
.badge.lv{background:#7789930}
.badge.lv{background:#8a99a3}
.stars{color:var(--gold);font-size:12px;letter-spacing:-1px}
.chk{flex:none;width:30px;height:30px;border-radius:50%;border:2px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:15px;color:transparent;background:#fff}
.chk.on{background:var(--ok);border-color:var(--ok);color:#fff}
.count{font-size:12px;color:var(--muted);margin:8px 2px}

/* modal */
.overlay{position:fixed;inset:0;background:rgba(15,28,38,.5);display:flex;align-items:flex-end;justify-content:center;z-index:50}
.modal{background:#fff;width:100%;max-width:760px;border-radius:18px 18px 0 0;padding:20px 18px 26px;max-height:88vh;overflow:auto}
@media(min-width:640px){.overlay{align-items:center}.modal{border-radius:18px}}
.modal .close{position:absolute;top:12px;right:14px;font-size:22px;color:var(--muted)}
.dt-jp{font-size:34px;font-weight:800;line-height:1.2}
.dt-rd{font-size:15px;color:var(--primary-d);font-weight:700;margin-top:4px}
.dt-rd .k{color:var(--muted);font-weight:500}
.dt-block{margin-top:14px}
.dt-label{font-size:11px;font-weight:800;color:var(--muted);letter-spacing:.06em;text-transform:uppercase;margin-bottom:2px}
.dt-mn{font-size:16px}
.dt-en{font-size:15px;color:var(--primary-d)}
.dt-ex{background:#f4f8f9;border-radius:10px;padding:11px 13px;font-size:15px}
.dt-ex .exen{color:var(--muted);font-style:italic;font-size:13.5px;margin-top:3px}
.dt-note{background:#fff7e8;border:1px solid #f0dcae;border-radius:10px;padding:9px 12px;font-size:13px;color:#7a5a12}
.dt-badges{display:flex;gap:6px;margin-top:12px;flex-wrap:wrap;align-items:center}

/* quiz */
.qhead{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--muted);margin-bottom:8px}
.qprompt{font-size:20px;font-weight:800;margin:6px 0 4px;line-height:1.35}
.qsub{font-size:13px;color:var(--muted);margin-bottom:14px}
.opt{display:block;width:100%;text-align:left;border:1.5px solid var(--line);background:#fff;border-radius:12px;padding:14px;margin-bottom:10px;font-size:16px;font-weight:600;transition:.15s}
.opt:active{transform:scale(.99)}
.opt.correct{background:#e7f6ec;border-color:var(--ok);color:#1f7a3a}
.opt.wrong{background:#fbe9e7;border-color:var(--ng);color:#a53a2e}
.opt.dim{opacity:.55}
.qexp{background:#f4f8f9;border-radius:12px;padding:12px 14px;font-size:14px;margin-top:4px}
.qexp .v{font-weight:800}
.qexp .v.ok{color:var(--ok)}.qexp .v.ng{color:var(--ng)}
.qresult{text-align:center;padding:20px}
.qresult .big{font-size:40px;font-weight:800;color:var(--primary)}
.mode-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mode{background:#fff;border:1.5px solid var(--line);border-radius:14px;padding:16px 12px;text-align:center;box-shadow:var(--shadow)}
.mode .ic{font-size:26px}
.mode .t{font-weight:800;margin-top:6px;font-size:14px}
.mode .d{font-size:11px;color:var(--muted);margin-top:2px}

/* progress bars per cat */
.pcat{margin-bottom:12px}
.pcat .top{display:flex;justify-content:space-between;font-size:13px;font-weight:700;margin-bottom:4px}
.pcat .top .r{color:var(--muted);font-weight:600}

/* bottom nav */
nav.tabs{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);display:flex;z-index:40;box-shadow:0 -2px 10px rgba(20,40,55,.06)}
nav.tabs button{flex:1;padding:9px 0 7px;font-size:10.5px;color:var(--muted);font-weight:700;display:flex;flex-direction:column;align-items:center;gap:2px}
nav.tabs button .ic{font-size:20px;line-height:1}
nav.tabs button.on{color:var(--primary)}
.empty{text-align:center;color:var(--muted);padding:30px 10px;font-size:14px}
.kwlist{display:flex;flex-wrap:wrap;gap:7px}
.kw{background:#eef4f6;border:1px solid #d7e3e7;border-radius:999px;padding:6px 12px;font-size:13px;font-weight:600}
.toast{position:fixed;bottom:86px;left:50%;transform:translateX(-50%);background:#1c2733;color:#fff;padding:9px 16px;border-radius:999px;font-size:13px;z-index:60;opacity:0;transition:.3s;pointer-events:none}
.toast.show{opacity:.95}
</style>
</head>
<body>
<header class="app">
 <div class="wrap">
  <div class="logo">井</div>
  <div>
   <h1>井口工務店 日本語学習ツール</h1>
   <div class="sub">Japanese for work · 建築・SE・職場のことば</div>
  </div>
 </div>
</header>

<main class="wrap">
 <section id="view-home" class="view"></section>
 <section id="view-glossary" class="view hidden"></section>
 <section id="view-grammar" class="view hidden"></section>
 <section id="view-quiz" class="view hidden"></section>
 <section id="view-progress" class="view hidden"></section>
</main>

<nav class="tabs">
 <button data-view="home" class="on"><span class="ic">🏠</span>ホーム</button>

 <button data-view="quiz"><span class="ic">📝</span>クイズ</button>

</nav>

<div id="overlay" class="overlay hidden"></div>
<div id="toast" class="toast"></div>

n": "Excuse me (entering/leaving)", "ex": "", "exEn": "", "stars": 4, "level": 2, "cat": "work", "note": "", "kanji": true}, {"id": 9, "jp": "お先に失礼します", "kana": "おさきにしつれいします", "romaji": "osakinishitsureishimasu", "mean": "先（さき）に帰（かえ）るとき。", "en": "Excuse me for leaving first", "ex": "", "exEn": "", "stars": 4, "level": 2, "cat": "work", "note": "", "kanji": true}, {"id": 10, "jp": "はい", "kana": "はい", "romaji": "hai", "mean": "「そうです」の返事（へんじ）。", "en": "Yes", "ex": "", "exEn": "", "stars": 5, "level": 1, "cat": "work", "note": "", "kanji": false}, {"id": 11, "jp": "いいえ", "kana": "いいえ", "romaji": "iie", "mean": "「ちがいます」の返事（へんじ）。", "en": "No", "ex": "", "exEn": "", "stars": 5, "level": 1, "cat": "work", "note": "", "kanji": false}, {"id": 12, "jp": "わかりました", "kana": "わかりました", "romaji": "wakarimashita", "mean": "理解（りかい）したとき。", "en": "I understand / OK", "ex": "「はい、わかりました。」", "exEn": "Yes, I understand.", "stars": 5, "level": 1, "cat": "work", "note": "", "kanji": false}, {"id": 13, "jp": "わかりません", "kana": "わかりません", "romaji": "wakarimasen", "mean": "理解（りかい）できないとき。", "en": "I don't understand", "ex": "", "exEn": "", "stars": 5, "level": 1, "cat": "work", "note": "", "kanji": false}, {"id": 14, "jp": "大丈夫", "kana": "だいじょうぶ", "romaji": "daijoubu", "mean": "問題（もんだい）ない。OK。", "en": "OK / fine", "ex": "「大丈夫（だいじょうぶ）です。」", "exEn": "It's fine.", "stars": 5, "level": 1, "cat": "work", "note": "", "kanji": true}, {"id": 15, "jp": "はじめまして", "kana": "はじめまして", "romaji": "hajimemashite", "mean": "初（はじ）めて会（あ）うあいさつ。", "en": "Nice to meet you", "ex": "", "exEn": "", "stars": 4, "level": 1, "cat": "work", "note": "", "kanji": false}, {"id": 16, "jp": "こんにちは", "kana": "こんにちは", "romaji": "konnichiha", "mean": "昼（ひる）のあいさつ。", "en": "Hello", "ex": "", "exEn": "", "stars": 4, "level": 1, "cat": "work", "note": "", "kanji": false}, {"id": 17, "jp": "こんばんは", "kana": "こんばんは", "romaji": "konbanha", "mean": "夜（よる）のあいさつ。", "en": "Good evening", "ex": "", "exEn": "", "stars": 3, "level": 1, "cat": "work", 8, "jp": "少し待ってください。", "kana": "すこしまってください", "romaji": "sukoshimattekudasai", "mean": "少（すこ）し待（ま）ってほしい。", "en": "Please wait a moment.", "ex": "", "exEn": "", "stars": 4, "level": 2, "cat": "phrase", "note": "", "kanji": true}, {"id": 289, "jp": "少し時間がかかります。", "kana": "すこしじかんがかかります", "romaji": "sukoshijikangakakarimasu", "mean": "終（お）わるまで時間（じかん）が必要。", "en": "It takes some time.", "ex": "", "exEn": "", "stars": 4, "level": 3, "cat": "phrase", "note": "", "kanji": true}, {"id": 290, "jp": "すみません、質問があります。", "kana": "すみません、しつもんがあります", "romaji": "sumimasen, shitsumongaarimasu", "mean": "質問（しつもん）したい。", "en": "Excuse me, I have a question.", "ex": "", "exEn": "", "stars": 4, "level": 2, "cat": "phrase", "note": "", "kanji": true}, {"id": 291, "jp": "こちらで合っていますか？", "kana": "こちらであっていますか", "romaji": "kochiradeatteimasuka", "mean": "これで正（ただ）しいか聞（き）く。", "en": "Is this correct?", "ex": "", "exEn": "", "stars": 4, "level": 3, "cat": "phrase", "note": "", "kanji": true}, {"id": 292, "jp": "終わりました。", "kana": "おわりました", "romaji": "owarimashita", "mean": "仕事（しごと）が終（お）わった。", "en": "I have finished.", "ex": "", "exEn": "", "stars": 5, "level": 2, "cat": "phrase", "note": "", "kanji": true}, {"id": 293, "jp": "まだ終わっていません。", "kana": "まだおわっていません", "romaji": "madaowatteimasen", "mean": "まだ終（お）わっていない。", "en": "Not finished yet.", "ex": "", "exEn": "", "stars": 4, "level": 2, "cat": "phrase", "note": "", "kanji": true}, {"id": 294, "jp": "問題ありません。", "kana": "もんだいありません", "romaji": "mondaiarimasen", "mean": "問題（もんだい）はない。", "en": "No problem.", "ex": "", "exEn": "", "stars": 5, "level": 2, "cat": "phrase", "note": "", "kanji": true}, {"id": 295, "jp": "問題があります。", "kana": "もんだいがあります", "romaji": "mondaigaarimasu", "mean": "問題（もんだい）がある。", "en": "There is a problem.", "ex": "", "exEn": "", "stars": 4, "level": 2, "cat": "phrase", "note": "", "kanji": true}, {"id": 296, "jp": "調べてみます。", "kana": "しらべてみます", "romaji": "shirabetemimasu", "mean": "これから調（しら）べる。", "en": "I'll look into it.", "ex": "", "exEn": "", "stars": 4, "level": 3, "cat": "phrase", "note": "", "kanji": true}, {"id": 297, "jp": "担当者に確認します。", "kana": "たんとうしゃにかくにんします", "romaji": "tantoushanikakuninshimasu", "mean": "担当（たんとう）の人に確認（かくにん）する。", "en": "I'll check with the person in charge.", "ex": "", "exEn": "", "stars": 4, "level": 3, "cat": "phrase", "note": "", "kanji": true}, {"id": 298, "jp": "明日までに対応します。", "kana": "あしたまでにたいおうします", "romaji": "ashitamadenitaioushimasu", "mean": "明日（あした）までに処理（しょり）する。", "en": "I'll handle it by tomorrow.", "ex": "", "exEn": "", "stars": 4, "level": 3, "cat": "phrase", "note": "", "kanji": true}, {"id": 299, "jp": "はい、わかりました。確認します。", "kana": "はい、わかりました。かくにんします", "romaji": "hai, wakarimashita. kakuninshimasu", "mean": "指示（しじ）にOKし、行動（こうどう）を返（かえ）す。", "en": "Yes, understood. I'll check.", "ex": "", "exEn": "", "stars": 5, "level": 2, "cat": "phrase", "note": "指示を受けたときの良い返事。", "kanji": true}, {"id": 300, "jp": "すみません、わかりません。", "kana": "すみません、わかりません", "romaji": "sumimasen, wakarimasen", "mean": "わからないことを正直（しょうじき）に言う。", "en": "Sorry, I don't understand.", "ex": "", "exEn": "", "stars": 4, "level": 1, "cat": "phrase", "note": "", "kanji": true}, {"id": 301, "jp": "大丈夫です。", "kana": "だいじょうぶです", "romaji": "daijoubudesu", "mean": "問題（もんだい）ない。", "en": "It's fine.", "ex": "", "exEn": "", "stars": 5, "level": 1, "cat": "phrase", "note": "", "kanji": true}, {"id": 302, "jp": "今、大丈夫ですか？", "kana": "いま、だいじょうぶですか", "romaji": "ima, daijoubudesuka", "mean": "今（いま）話（はな）してもいいか聞（き）く。", "en": "Is now a good time?", "ex": "", "exEn": "", "stars": 3, "level": 3, "cat": "phrase", "note": "", "kanji": true}, {"id": 303, "jp": "手伝ってください。", "kana": "てつだってください", "romaji": "tetsudattekudasai", "mean": "助（たす）けてほしい。", "en": "Please help me.", "ex": "", "exEn": "", "stars": 4, "level": 2, "cat": "phrase", "note": "", "kanji": true}, {"id": 304, "jp": "教えてください。", "kana": "おしえてください", "romaji": "oshietekudasai", "mean": "教（おし）えてほしい。", "en": "Please teach/tell me.", "ex": "", "exEn": "", "stars": 5, "level": 2, "cat": "phrase", "note": "", "kanji": true}, {"id": 305, "jp": "できました。", "kana": "できました", "romaji": "dekimashita", "mean": "できた・終（お）わった。", "en": "It's done.", "ex": "", "exEn": "", "stars": 4, "level": 2, "cat": "phrase", "note": "", "kanji": true}, {"id": 306, "jp": "できません。", "kana": "できません", "romaji": "dekimasen", "mean": "できない。", "en": "I can't do it.", "ex": "", "exEn": "", "stars": 3, "level": 2, "cat": "phrase", "note": "", "kanji": true}, {"id": 307, "jp": "やってみます。", "kana": "やってみます", "romaji": "yattemimasu", "mean": "ためしにやる。", "en": "I'll give it a try.", "ex": "", "exEn": "", "stars": 3, "level": 3, "cat": "phrase", "note": "", "kanji": true}, {"id": 308, "jp": "確認をお願いします。", "kana": "かくにんをおねがいします", "romaji": "kakuninoonegaishimasu", "mean": "確認（かくにん）してほしい。", "en": "Please check it.", "ex": "", "exEn": "", "stars": 4, "level": 3, "cat": "phrase", "note": "", "kanji": true}, {"id": 309, "jp": "報告します。", "kana": "ほうこくします", "romaji": "houkokushimasu", "mean": "結果（けっか）を伝（つた）える。", "en": "I'll report.", "ex": "", "exEn": "", "stars": 4, "level": 2, "cat": "phrase", "note": "", "kanji": true}, {"id": 310, "jp": "連絡します。", "kana": "れんらくします", "romaji": "renrakushimasu", "mean": "あとで連絡（れんらく）する。", "en": "I'll contact you.", "ex": "", "exEn": "", "stars": 4, "level": 2, "cat": "phrase", "note": "", "kanji": true}, {"id": 311, "jp": "相談があります。", "kana": "そうだんがあります", "romaji": "soudangaarimasu", "mean": "相談（そうだん）したい。", "en": "I'd like to consult you.", "ex": "", "exEn": "", "stars": 4, "level": 3, "cat": "phrase", "note": "", "kanji": true}, {"id": 312, "jp": "すみません、遅れます。", "kana": "すみません、おくれます", "romaji": "sumimasen, okuremasu", "mean": "時間（じかん）におくれる。", "en": "Sorry, I'll be late.", "ex": "", "exEn": "", "stars": 4, "level": 2, "cat": "phrase", "note": "", "kanji": true}, {"id": 313, "jp": "承知しました。", "kana": "しょうちしました", "romaji": "shouchishimashita", "mean": "ていねいな「わかりました」。", "en": "Understood (polite).", "ex": "", "exEn": "", "stars": 3, "level": 3, "cat": "phrase", "note": "上司やお客様に使う。", "kanji": true}, {"id": 314, "jp": "かしこまりました。", "kana": "かしこまりました", "romaji": "kashikomarimashita", "mean": "とてもていねいな「わかりました」。", "en": "Certainly (very polite).", "ex": "", "exEn": "", "stars": 2, "level": 4, "cat": "phrase", "note": "お客様によく使う。", "kanji": true}, {"id": 315, "jp": "確認してから連絡します。", "kana": "かくにんしてかられんらくします", "romaji": "kakuninshitekararenrakushimasu", "mean": "確認（かくにん）のあとで連絡する。", "en": "I'll contact you after checking.", "ex": "", "exEn": "", "stars": 3, "level": 3, "cat": "phrase", "note": "", "kanji": true}, {"id": 316, "jp": "まだ作業中です。", "kana": "まださぎょうちゅうです", "romaji": "madasagyouchuudesu", "mean": "今（いま）まだやっている。", "en": "I'm still working on it.", "ex": "", "exEn": "", "stars": 3, "level": 3, "cat": "phrase", "note": "", "kanji": true}, {"id": 317, "jp": "写真を撮ります。", "kana": "しゃしんをとります", "romaji": "shashinotorimasu", "mean": "写真（しゃしん）を とる。", "en": "I'll take a photo.", "ex": "", "exEn": "", "stars": 3, "level": 3, "cat": "phrase", "note": "", "kanji": true}, {"id": 318, "jp": "データを送ります。", "kana": "データをおくります", "romaji": "deetaookurimasu", "mean": "データを おくる。", "en": "I'll send the data.", "ex": "", "exEn": "", "stars": 3, "level": 3, "cat": "phrase", "note": "", "kanji": true}, {"id": 319, "jp": "少し難しいです。", "kana": "すこしむずかしいです", "romaji": "sukoshimuzukashiidesu", "mean": "ちょっとむずかしい。", "en": "It's a little difficult.", "ex": "", "exEn": "", "stars": 3, "level": 3, "cat": "phrase", "note": "", "kanji": true}, {"id": 320, "jp": "助かりました。", "kana": "たすかりました", "romaji": "tasukarimashita", "mean": "助（たす）けてくれてありがとう。", "en": "That really helped, thanks.", "ex": "", "exEn": "", "stars": 2, "level": 3, "cat": "phrase", "note": "", "kanji": true}, {"id": 321, "jp": "気をつけます。", "kana": "きをつけます", "romaji": "kiotsukemasu", "mean": "注意（ちゅうい）する。", "en": "I'll be careful.", "ex": "", "exEn": "", "stars": 3, "level": 2, "cat": "phrase", "note": "", "kanji": true}, {"id": 322, "jp": "お願いできますか？", "kana": "おねがいできますか", "romaji": "onegaidekimasuka", "mean": "ていねいにたのむ。", "en": "Could you please do it?", "ex": "", "exEn": "", "stars": 4, "level": 3, "cat": "phrase", "note": "", "kanji": true}, {"id": 323, "jp": "後で確認します。", "kana": "あとでかくにんします", "romaji": "atodekakuninshimasu", "mean": "あとで確認（かくにん）する。", "en": "I'll check later.", "ex": "", "exEn": "", "stars": 3, "level": 2, "cat": "phrase", "note": "", "kanji": true}, {"id": 324, "jp": "すぐにやります。", "kana": "すぐにやります", "romaji": "suguniyarimasu", "mean": "今（いま）すぐする。", "en": "I'll do it right away.", "ex": "", "exEn": "", "stars": 3, "level": 2, "cat": "phrase", "note": "", "kanji": true}, {"id": 325, "jp": "わかりました、ありがとうございます。", "kana": "わかりました、ありがとうございます", "romaji": "wakarimashita, arigatougozaimasu", "mean": "理解（りかい）＋お礼（れい）。", "en": "Understood, thank you.", "ex": "", "exEn": "", "stars": 4, "level": 2, "cat": "phrase", "note": "", "kanji": true}, {"id": 326, "jp": "すみません、もう少しゆっくりお願いします。", "kana": "すみません、もうすこしゆっくりおねがいします", "romaji": "sumimasen, mousukoshiyukkurionegaishimasu", "mean": "もっとゆっくり話してほしい。", "en": "Sorry, a little more slowly please.", "ex": "", "exEn": "", "stars": 4, "level": 2, "cat": "phrase", "note": "", "kanji": true}, {"id": 327, "jp": "確認中です。", "kana": "かくにんちゅうです", "romaji": "kakuninchuudesu", "mean": "今（いま）確認（かくにん）している。", "en": "I'm checking now.", "ex": "", "exEn": "", "stars": 3, "level": 3, "cat": "phrase", "note": "", "kanji": true}, {"id": 328, "jp": "お世話になっております。", "kana": "おせわになっております", "romaji": "osewaninatteorimasu", "mean": "仕事（しごと）でよく使うあいさつ。", "en": "(common business greeting)", "ex": "", "exEn": "", "stars": 3, "level": 4, "cat": "phrase", "note": "メールや電話の始めに使う。", "kanji": true}, {"id": 329, "jp": "使う", "kana": "つかう", "romaji": "tsukau", "mean": "ものを利用（りよう）する。", "en": "to use", "ex": "「パソコンを使（つか）います。」", "exEn": "I use a PC.", "stars": 5, "level": 2, "cat": "n3", "note": "", "kanji": true}, {"id": 330, "jp": "覚える", "kana": "おぼえる", "romaji": "oboeru", "mean": "頭（あたま）に入（い）れる。学ぶ。", "en": "to memorize / learn", "ex": "「言葉（ことば）を覚（おぼ）えます。」", "exEn" ": "", "kanji": true}, {"id": 349, "jp": "貸す", "kana": "かす", "romaji": "kasu", "mean": "自分（じぶん）のものを人（ひと）に使わせる。", "en": "to lend", "ex": "", "exEn": "", "stars": 3, "level": 3, "cat": "n3", "note": "", "kanji": true}, {"id": 350, "jp": "返す", "kana": "かえす", "romaji": "kaesu", "mean": "借（か）りたものを戻（もど）す。", "en": "to return (a thing)", "ex": "", "exEn": "", "stars": 3, "level": 3, "cat": "n3", "note": "", "kanji": true}, {"id": 351, "jp": "試す", "kana": "ためす", "romaji": "tamesu", "mean": "うまくいくか やってみる。", "en": "to try / test", "ex": "", "exEn": "", "stars": 3, "level": 3, "cat": "n3", "note": "", "kanji": true}, {"id": 352, "jp": "確かめる", "kana": "たしかめる", "romaji": "tashikameru", "mean": "正（ただ）しいか調（しら）べる。", "en": "to make sure", "ex": "", "exEn": "", "stars": 4, "level": 3, "cat": "n3", "note": "「確認（かくにん）する」の動詞。", "kanji": true}, {"id": 353, "jp": "間違える", "kana": "まちがえる", "romaji": "machigaeru", "mean": "正（ただ）しくないことをする。", "en": "to make a mistake", "ex": "「番号（ばんごう）を間違（まちが）えました。」", "exEn": "I got the number wrong.", "stars": 4, "level": 3, "cat": "n3", "note": "", "kanji": true}, {"id": 354, "jp": "直す", "kana": "なおす", "romaji": "naosu", "mean": "正（ただ）しくする。悪（わる）いところをなおす。", "en": "to fix / correct", "ex": "「バグを直（なお）します。」", "exEn": "I'll fix the bug.", "stars": 4, "level": 3, "cat": "n3", "note": "", "kanji": true}, {"id": 355, "jp": "困る", "kana": "こまる", "romaji": "komaru", "mean": "どうしたらいいか わからず こまる。", "en": "to be in trouble", "ex": "「困（こま）ったときは相談（そうだん）します。」", "exEn": "When in trouble, I consult.", "stars": 4, "level": 3, "cat": "n3", "note": "", "kanji": true}, {"id": 356, "jp": "迷う", "kana": "まよう", "romaji": "mayou", "mean": "どちらか決（き）められない。道（みち）がわからない。", "en": "to hesitate / get lost", "ex": "", "exEn": "", "stars": 3, "level": 3, "cat": "n3", "note": "", "kanji": true}, {"id": 357, "jp": "気づく", "kana": "きづく", "romaji": "kizuku", "mean": "はじめてわかる・きがつく。", "en": "to notice", "ex": "", "exEn": "", "stars": 3, "level": 3, "cat": "n3", "note": "", "kanji": true}, {"id": 358, "jp const TOTAL=TERMS.length;
const CATKEYS=Object.keys(CAT);

/* ---------- storage (safe: falls back to memory if blocked) ---------- */
const _mem={};
const store={
 get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v);}catch(e){return (k in _mem)?_mem[k]:d;}},
 set(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){_mem[k]=v;}}
};
let known=new Set(store.get('ig_known',[]));
let seen=new Set(store.get('ig_seen',[]));
let qstats=store.get('ig_qstats',{total:0,correct:0});
function save(){store.set('ig_known',[...known]);store.set('ig_seen',[...seen]);store.set('ig_qstats',qstats);}

/* ---------- helpers ---------- */
const byId=id=>TERMS.find(t=>t.id===id);
function ruby(t,big){ if(t.kanji){return '<ruby>'+esc(t.jp)+'<rt>'+esc(t.kana)+'</rt></ruby>';} return esc(t.jp);}
function esc(s){return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function stars(n){return '★★★★★'.slice(0,n)+'☆☆☆☆☆'.slice(0,5-n);}
function statusOf(id){return known.has(id)?'known':(seen.has(id)?'learning':'new');}
function markSeen(id){if(!known.has(id)&&!seen.has(id)){seen.add(id);save();}}
function toggleKnown(id){if(known.has(id)){known.delete(id);}else{known.add(id);seen.add(id);}save();}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('show'),1400);}

/* ---------- navigation ---------- */
let current='home';

 current=v;
 ['home','glossary','grammar','quiz','progress'].forEach(x=>{
   document.getElementById('view-'+x).classList.toggle('hidden',x!==v);
 });
 document.querySelectorAll('nav.tabs button').forEach(b=>b.classList.toggle('on',b.dataset.view===v));
 window.scrollTo(0,0);
 if(v==='home')renderHome();
 if(v==='glossary')renderGlossary();
 if(v==='grammar')renderGrammar();
 if(v==='quiz')renderQuizHome();
 if(v==='progress')renderProgress();
}
document.querySelectorAll('nav.tabs button').forEach(b=>b.onclick=()=>show(b.dataset.view));

/* ---------- HOME ---------- */
function todayWords(){
 const today=new Date().toISOString().slice(0,10);
 let t=store.get('ig_today',null);
 if(t&&t.date===today&&Array.isArray(t.ids)){return t.ids.map(byId).filter(Boolean);}
 let pool=TERMS.filter(x=>!known.has(x.id));
 let review=false;
 if(pool.length<5){pool=TERMS.slice();review=true;}
 pool.sort((a,b)=> a.level-b.level || b.stars-a.stars || a.id-b.id);
 const dayNum=Math.floor(Date.now()/86400000);
 const start=(dayNum*5)%pool.length;
 const ids=[];
 for(let i=0;i<5;i++){ids.push(pool[(start+i)%pool.length].id);}
 store.set('ig_today',{date:today,ids:ids});
 return ids.map(byId);
}

 const el=document.getElementById('view-home');
 const knownN=known.size, pct=Math.round(knownN/TOTAL*100);

 let html='';
 html+='<div class="card pad" style="margin-top:16px">'
  +'<div class="stat-row">'

  +'<div class="stat"><div class="n">'+TOTAL+'</div><div class="l">全単語 / Total</div></div>'
  +'<div class="stat"><div class="n">'+pct+'%</div><div class="l">進捗 / Progress</div></div>'
  +'</div>'
  +'<div class="bar" style="margin-top:6px"><i style="width:'+pct+'%"></i></div>'
  +'<div class="pct"><span>学習済み '+knownN+' / '+TOTAL+'</span><span>あと '+(TOTAL-knownN)+'</span></div>'
  +'</div>';

 html+='<div class="h2">今日の5単語 <span style="font-weight:500;color:var(--muted);font-size:12px">Today\'s 5 words</span></div>';
 tw.forEach(t=>{
  html+='<div class="card tw">'
   +'<div class="jp">'+ruby(t)+'</div>'
   +'<div class="rd">Reading: <b>'+esc(t.romaji)+'</b>'+(t.kanji?'　（'+esc(t.kana)+'）':'')+'　'+stars(t.stars)+'</div>'
   +'<div class="mn">'+esc(t.mean)+'</div>'

   +'</div>';
 });
 html+='<div class="btn-row"><button class="btn" onclick="startQuizIds('+JSON.stringify(tw.map(t=>t.id))+',\'jaen\')">この5語をテスト / Test these 5</button></div>';

 html+='<div class="btn-row">'

  +'<button class="btn sec" onclick="show(\'glossary\')">📖 用語集を見る</button>'
  +'</div>';
 el.innerHTML=html;
}

 const list=filtered();

 html+='<div class="wlist">';
 list.forEach(t=>{

 });
 html+='</div>';
 if(list.length===0)html+='<div class="empty">見つかりません / No results</div>';
 el.innerHTML=html;

 document.getElementById('gq').oninput=e=>{gf.q=e.target.value;renderList();};
 document.getElementById('gcat').querySelectorAll('button').forEach(b=>b.onclick=()=>{gf.cat=b.dataset.c;renderGlossary();});
 document.getElementById('glevel').onchange=e=>{gf.level=e.target.value;renderList();};
 document.getElementById('gstatus').onchange=e=>{gf.status=e.target.value;renderList();};
 document.getElementById('gstar').onchange=e=>{gf.star=e.target.value;renderList();};
}
function renderList(){ // lighter re-render keeping focus on search
 renderGlossary();
 const q=document.getElementById('gq'); if(q){q.focus();q.setSelectionRange(q.value.length,q.value.length);}
}
function filtered(){
 const q=gf.q.trim().toLowerCase();
 return TERMS.filter(t=>{
  if(gf.cat!=='all'&&t.cat!==gf.cat)return false;
  if(gf.level!=='all'&&t.level!=+gf.level)return false;
  if(gf.star!=='all'&&t.stars!=+gf.star)return false;
  if(gf.status!=='all'&&statusOf(t.id)!==gf.status)return false;
  if(q){const hay=(t.jp+' '+t.kana+' '+t.romaji+' '+t.en+' '+t.mean).toLowerCase();if(!hay.includes(q))return false;}
  return true;
 });
}

 html+='<p style="font-size:12.5px;color:var(--muted);margin:0 2px 8px">レベルをえらんで、文法カードをタップすると、意味・作り方（接続）・例文がみられます。</p>';
 html+='<div class="chips" id="grtabs">';
 GLEVELS.forEach(l=>{const n=GRAMMAR.filter(g=>g.level===l).length;html+='<button class="chip'+(grLevel===l?' on':'')+'" data-l="'+l+'">'+l+' ('+n+')</button>';});
 html+='</div>';
 html+='<div class="search"><input id="grq" type="text" placeholder="文法を検索 / search pattern or meaning" value="'+esc(grQ)+'"></div>';
 const q=grQ.trim().toLowerCase();
 const list=GRAMMAR.filter(g=>g.level===grLevel && (!q || (g.pat+' '+g.mean+' '+g.en+' '+g.form).toLowerCase().includes(q)));
 html+='<div class="count">'+list.length+' 項目 / points</div>';
 html+='<div class="wlist">';
 list.forEach(g=>{const gi=GRAMMAR.indexOf(g);
  html+='<div class="card witem" onclick="openGrammar('+gi+')">'
   +'<div class="main">'
    +'<div class="jp" style="font-size:19px">'+furiHtml(g.pat)+'</div>'
    +'<div class="en" style="white-space:normal">'+esc(g.mean)+'</div>'
    +'<div class="badges"><span class="badge" style="background:var(--primary)">'+g.level+'</span>'
     +'<span class="en" style="margin:0">'+esc(g.en)+'</span></div>'
   +'</div><span style="color:var(--muted);font-size:20px">›</span>'
   +'</div>';
 });
 html+='</div>';
 if(list.length===0)html+='<div class="empty">見つかりません / No results</div>';
 el.innerHTML=html;
 document.getElementById('grtabs').querySelectorAll('button').forEach(b=>b.onclick=()=>{grLevel=b.dataset.l;renderGrammar();});
 const gi=document.getElementById('grq');gi.oninput=e=>{grQ=e.target.value;renderGrammar();const x=document.getElementById('grq');x.focus();x.setSelectionRange(x.value.length,x.value.length);};
}
// convert inline "漢字（かな）" to ruby for nicer display
function furiHtml(s){
 return esc(s).replace(/([一-龥々]+)（([ぁ-ゖ・]+)）/g,'<ruby>$1<rt>$2</rt></ruby>');
}
function openGrammar(i){
 const g=GRAMMAR[i];
 const ov=document.getElementById('overlay');
 let ex=g.ex.map(e=>'<div class="dt-ex" style="margin-bottom:8px">'+furiHtml(e.jp)+'<div class="exen">'+esc(e.en)+'</div></div>').join('');
 ov.innerHTML='<div class="modal" onclick="event.stopPropagation()">'
  +'<button class="close" onclick="closeDetail()">✕</button>'
  +'<div class="dt-badges" style="margin-top:0"><span class="badge" style="background:var(--primary)">'+g.level+'</span></div>'
  +'<div class="dt-jp" style="font-size:27px;margin-top:8px">'+furiHtml(g.pat)+'</div>'
  +'<div class="dt-block"><div class="dt-label">意味 / Meaning</div><div class="dt-mn">'+esc(g.mean)+'</div><div class="dt-en">'+esc(g.en)+'</div></div>'
  +'<div class="dt-block"><div class="dt-label">作り方 / Formation</div><div class="dt-ex" style="font-size:14px">'+furiHtml(g.form)+'</div></div>'
  +'<div class="dt-block"><div class="dt-label">例文 / Examples</div>'+ex+'</div>'
  +(g.note?'<div class="dt-block"><div class="dt-note">💡 '+furiHtml(g.note)+'</div></div>':'')
  +'</div>';
 ov.classList.remove('hidden');ov.onclick=closeDetail;
}

/* ---------- QUIZ ---------- */
function renderQuizHome(){
 const el=document.getElementById('view-quiz');
 let html='<div class="h2" style="margin-top:16px">クイズ / Quiz</div>';
 html+='<p style="font-size:13px;color:var(--muted);margin:0 2px 12px">クイズの しゅるいを えらんでください。 Choose a quiz type.</p>';
 html+='<div class="mode-grid">'
  +modeBtn('jaen','🔤','日本語 → English','意味をあてる')
  +modeBtn('enja','🔠','English → 日本語','単語をあてる')
  +modeBtn('reading','🗣️','読み方 / Reading','ローマ字をあてる')
  +modeBtn('conv','💬','実務会話 / Conversation','正しい返事は？')
  +'</div>';
 html+='<div class="h2">分野で練習 / By field</div>';
 html+='<div class="mode-grid">'
  +modeBtn('cat:basic','🌱','基礎（N5/N4）','基礎の単語')
  +modeBtn('cat:arch','🏠','建築 / Construction','建築の単語')
  +modeBtn('cat:it','💻','SE・IT','ITの単語')
  +modeBtn('cat:work','🏢','職場日本語','職場の単語')
  +modeBtn('cat:phrase','🗨️','会話表現','よく使う文')
  +modeBtn('cat:n3','📚','一般（N3）','N3の単語')
  +'</div>';
 el.innerHTML=html;
 el.querySelectorAll('.mode').forEach(m=>m.onclick=()=>startQuiz(m.dataset.m));
}
function modeBtn(m,ic,t,d){return '<button class="mode" data-m="'+m+'"><div class="ic">'+ic+'</div><div class="t">'+t+'</div><div class="d">'+d+'</div></button>';}

let quiz=null;
function startQuiz(mode){
 if(mode==='conv'){
  const items=shuffle(CONV).slice(0,Math.min(8,CONV.length)).map(c=>({type:'conv',q:c.q,opts:c.opts,ans:c.ans,exp:c.exp}));
  quiz={items,idx:0,score:0};return renderQuestion();
 }
 let type=mode, pool=TERMS;
 if(mode.startsWith('cat:')){const c=mode.slice(4);pool=TERMS.filter(t=>t.cat===c);type= c==='phrase'?'jaen':'jaen';}
 // build questions
 const n=Math.min(10,pool.length);
 const picks=shuffle(pool).slice(0,n);
 const items=picks.map(t=>buildQ(t,type,pool));
 quiz={items,idx:0,score:0};
 renderQuestion();
}
function startQuizIds(ids,type){
 const picks=ids.map(byId).filter(Boolean);
 const items=picks.map(t=>buildQ(t,type,TERMS));
 quiz={items,idx:0,score:0};
 show('quiz');renderQuestion();
}
function buildQ(t,type,pool){
 if(type==='enja'){
  const others=shuffle(pool.filter(x=>x.id!==t.id&&x.en!==t.en)).slice(0,3);
  const opts=shuffle([t].concat(others));
  return {type:'enja',prompt:t.en,sub:'English → 日本語',opts:opts.map(o=>({html:ruby(o)+' <span style="color:var(--muted);font-size:13px">'+esc(o.romaji)+'</span>',ok:o.id===t.id})),
    exp:'「'+t.jp+'」（'+t.romaji+'）＝ '+t.en+'　'+t.mean};
 }
 if(type==='reading'){
  const near=vowelSwap(t.romaji);
  let others=shuffle(pool.filter(x=>x.id!==t.id&&x.romaji!==t.romaji&&x.romaji!==near)).slice(0,2).map(x=>x.romaji);
  let set=[t.romaji];
  if(near&&near!==t.romaji)set.push(near);
  others.forEach(o=>{if(set.length<4)set.push(o);});
  while(set.length<4){set.push(vowelSwap(t.romaji+'a'));}
  set=[...new Set(set)].slice(0,4);
  if(!set.includes(t.romaji))set[0]=t.romaji;
  const opts=shuffle(set.map(r=>({html:esc(r),ok:r===t.romaji})));
  return {type:'reading',prompt:(t.kanji?ruby(t):esc(t.jp)),sub:'読み方は？ What is the reading?',opts,exp:'「'+t.jp+'」＝ '+t.romaji+'（'+t.kana+'）'};
 }
 // jaen default
 const others=shuffle(pool.filter(x=>x.id!==t.id&&x.en!==t.en)).slice(0,3);
 const opts=shuffle([t].concat(others));
 return {type:'jaen',prompt:(t.kanji?ruby(t):esc(t.jp)),sub:(t.kanji?('（'+t.kana+'） '):'')+t.romaji+'　の意味は？',
   opts:opts.map(o=>({html:esc(o.en),ok:o.id===t.id})),exp:'「'+t.jp+'」（'+t.romaji+'）＝ '+t.en+'　'+t.mean};
}
function vowelSwap(r){const v='aiueo';for(let i=r.length-1;i>=0;i--){const p=v.indexOf(r[i]);if(p>=0){const nv=v[(p+1)%5];return r.slice(0,i)+nv+r.slice(i+1);}}return r;}

function renderQuestion(){
 const el=document.getElementById('view-quiz');
 const q=quiz.items[quiz.idx];
 let html='<div class="card pad" style="margin-top:16px">';
 html+='<div class="qhead"><span>問題 '+(quiz.idx+1)+' / '+quiz.items.length+'</span><span>正解 '+quiz.score+'</span></div>';
 if(q.type==='conv'){html+='<div class="qprompt" style="font-size:16px">'+q.q+'</div>';}
 else{html+='<div class="qprompt">'+q.prompt+'</div><div class="qsub">'+q.sub+'</div>';}
 html+='<div id="opts">';
 const opts=q.type==='conv'?q.opts.map((o,i)=>({html:esc(o),ok:i===q.ans})):q.opts;
 opts.forEach((o,i)=>{html+='<button class="opt" data-i="'+i+'">'+o.html+'</button>';});
 html+='</div><div id="qfoot"></div></div>';
 el.innerHTML=html;
 el.querySelectorAll('.opt').forEach(b=>b.onclick=()=>answer(+b.dataset.i,opts,q));
}
function answer(i,opts,q){
 const btns=document.querySelectorAll('#opts .opt');
 btns.forEach((b,j)=>{b.disabled=true;b.onclick=null;
   if(opts[j].ok)b.classList.add('correct');
   else if(j===i)b.classList.add('wrong');
   else b.classList.add('dim');});
 const ok=opts[i].ok;
 if(ok)quiz.score++;
 const foot=document.getElementById('qfoot');
 foot.innerHTML='<div class="qexp"><span class="v '+(ok?'ok':'ng')+'">'+(ok?'◯ 正解！':'✕ ちがいます')+'</span>　'+esc(q.exp)+'</div>'
  +'<button class="btn" style="margin-top:12px" id="qnext">'+(quiz.idx+1<quiz.items.length?'次へ / Next':'結果を見る / Result')+'</button>';
 document.getElementById('qnext').onclick=()=>{
   if(quiz.idx+1<quiz.items.length){quiz.idx++;renderQuestion();}
   else{finishQuiz();}
 };
}
function finishQuiz(){
 qstats.total+=quiz.items.length;qstats.correct+=quiz.score;save();
 const el=document.getElementById('view-quiz');
 const pct=Math.round(quiz.score/quiz.items.length*100);
 el.innerHTML='<div class="card qresult" style="margin-top:16px">'
  +'<div style="font-size:15px;color:var(--muted)">結果 / Result</div>'
  +'<div class="big">'+quiz.score+' / '+quiz.items.length+'</div>'
  +'<div style="font-size:16px;font-weight:700;color:var(--primary-d)">正答率 '+pct+'%</div>'
  +'<div style="font-size:30px;margin:10px 0">'+(pct>=80?'🎉':pct>=50?'👍':'💪')+'</div>'
  +'<p style="font-size:14px;color:var(--muted)">'+(pct>=80?'すばらしい！ Great!':pct>=50?'いいですね！つづけましょう。':'だいじょうぶ。もう一度れんしゅう！')+'</p>'
  +'<div class="btn-row"><button class="btn sec" onclick="renderQuizHome()">もう一度 / Again</button>'
  +'<button class="btn" onclick="show(\'progress\')">進捗を見る</button></div>'
  +'</div>';
}

/* ---------- PROGRESS ---------- */
function renderProgress(){
 const el=document.getElementById('view-progress');
 const knownN=known.size,pct=Math.round(knownN/TOTAL*100);
 let html='<div class="h2" style="margin-top:16px">全体の進捗 / Overall</div>';
 html+='<div class="card pad"><div class="bar"><i style="width:'+pct+'%"></i></div>'
  +'<div class="pct"><span>覚えた '+knownN+' / '+TOTAL+'</span><span>'+pct+'%</span></div></div>';

 html+='<div class="h2">カテゴリー別 / By category</div><div class="card pad">';
 CATKEYS.forEach(k=>{
  const all=TERMS.filter(t=>t.cat===k);const kn=all.filter(t=>known.has(t.id)).length;
  const p=all.length?Math.round(kn/all.length*100):0;
  html+='<div class="pcat"><div class="top"><span>'+CAT[k].label+'</span><span class="r">'+kn+' / '+all.length+'</span></div>'
   +'<div class="bar"><i style="width:'+p+'%;background:'+CAT[k].color+'"></i></div></div>';
 });
 html+='</div>';

 const acc=qstats.total?Math.round(qstats.correct/qstats.total*100):0;
 html+='<div class="h2">クイズ正答率 / Quiz accuracy</div>';
 html+='<div class="card pad"><div class="stat-row">'
  +'<div class="stat"><div class="n">'+qstats.total+'</div><div class="l">回答 / Answered</div></div>'
  +'<div class="stat"><div class="n">'+qstats.correct+'</div><div class="l">正解 / Correct</div></div>'
  +'<div class="stat"><div class="n">'+acc+'%</div><div class="l">正答率 / Accuracy</div></div>'
  +'</div></div>';

 html+='<div class="h2">覚えた単語 / Learned words ('+knownN+')</div>';
 const kw=TERMS.filter(t=>known.has(t.id));
 if(kw.length){html+='<div class="kwlist">'+kw.map(t=>'<button class="kw" onclick="openDetail('+t.id+')">'+esc(t.jp)+'</button>').join('')+'</div>';}
 else{html+='<div class="empty">まだありません。用語集からチェックしましょう。<br>None yet — mark words in the glossary.</div>';}

 html+='<div style="margin-top:22px"><button class="btn gray sm" onclick="resetAll()">進捗をリセット / Reset progress</button></div>';
 el.innerHTML=html;
}
function resetAll(){
 if(!confirm('学習の記録をすべて消しますか？\nReset all progress?'))return;
 known=new Set();seen=new Set();qstats={total:0,correct:0};
 store.set('ig_today',null);save();
 toast('リセットしました');renderProgress();
}

/* init */
show('home');
</script>
